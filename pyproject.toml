[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devdeck"
version = "0.1.0"
description = "DevDeck • On-Device Autonomous Code Repair & Knowledge Graph Runtime"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "websockets>=11.0",
    "qrcode>=7.4"
]

[project.scripts]
devdeck = "devdeck:cli_entry"
devdeck-relay = "relay_server:entry_point"

[tool.setuptools]
py-modules = [
    "devdeck",
    "relay_server",
    "repo_context",
    "patch_manager",
    "sandbox_verifier",
    "sandbox_runner",
    "repair_memory",
    "bridge_protocol",
    "bridge_security",
    "pairing_state",
    "pipeline_events",
    "subprocess_guard",
    "file_transaction",
    "git_transaction_engine"
]